minimum-uploads-part-size=Tamaño de la parte mínima (Automatic Translation)
minimum-uploads-part-size-help=Establece el tamaño de la mínima parte para subir las partes. Disminuir el tamaño de la parte mínima hace que varias partes subidas a dividirse en un número mayor de piezas más pequeñas. Establecer este valor demasiado bajo tiene un efecto negativo sobre la velocidad de transferencia, causando extra latencia y red de comunicación para cada parte (Automatic Translation)
multipart-upload-threshold=Umbral de carga de partes múltiples (Automatic Translation)
multipart-upload-threshold-help=Define el umbral de tamaño en bytes para Cuándo usar varias partes subidas. Cargas sobre este tamaño automáticamente utilizará una estrategia de subir varias partes, mientras que cargas más pequeñas que este umbral uso una sola conexión para subir todo el objeto (Automatic Translation)
s3-region=Región de S3 (Automatic Translation)
s3-region-help=Amazon S3 regiones permite al usuario elegir la región geográfica donde Amazon S3 almacenan los cubos crea. Elija una región de Amazon S3 para optimizar la latencia, minimizar los costos o requerimientos regulatorios. Objetos almacenados en una región de Amazon S3 nunca abandonar la región a menos que explícitamente transferidos a otra región (Automatic Translation)
s3-storage-class=Clase de almacenamiento S3 (Automatic Translation)
s3-storage-class-help=Amazon S3 ofrece múltiples clases de almacenamiento de información para las necesidades de diferentes clientes. La clase de almacenamiento estándar es la clase de almacenamiento por defecto y significa que copias redundantes de los datos se almacenarán en lugares diferentes. La clase de almacenamiento REDUCED_REDUNDANCY ofrece a los clientes que están usando Amazon S3 para almacenar datos no críticos, reproducibles una opción de almacenamiento de información altamente disponible, pero menos redundante, de bajo costo (Automatic Translation)
