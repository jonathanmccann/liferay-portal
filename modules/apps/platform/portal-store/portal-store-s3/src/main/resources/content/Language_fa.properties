minimum-uploads-part-size-help=اندازه بخش حداقل برای آپلود قطعات را تنظیم می کند. کاهش اندازه بخش حداقل ارسال چند بخشی به تعداد زیادی از قطعات کوچک تر تقسیم می شود. این مقدار خیلی کم تعیین اثر منفی بر روی سرعت انتقال باعث رکود و شبکه ارتباطی اضافی برای هر بخش است (Automatic Translation)
multipart-upload-threshold=ارسال چند بخشی آستانه (Automatic Translation)
multipart-upload-threshold-help=مجموعه از آستانه اندازه در بایت برای زمانی که نیاز به استفاده از ارسال چند بخشی. ارسال بیش از این اندازه به طور خودکار یک استراتژی ارسال چند بخشی در حالی که ارسال کوچکتر از این آستانه اتصال تنها برای آپلود شی کل استفاده می کنید استفاده کنید (Automatic Translation)
s3-region=منطقه S3 (Automatic Translation)
s3-region-help=آمازون S3 مناطق اجازه می دهد کاربر برای انتخاب منطقه جغرافیایی که در آن S3 آمازون فروشگاه سطل کاربر ایجاد می کند. منطقه آمازون S3 به پوشیدگی بهینه سازی هزینه های به حداقل رساندن یا آدرس الزامات قانونی را انتخاب کنید. اشیاء ذخیره شده در منطقه آمازون S3 هرگز ترک منطقه مگر صراحت به منطقه دیگر منتقل (Automatic Translation)
s3-storage-class=کلاس ذخیره سازی S3 (Automatic Translation)
s3-storage-class-help=S3 آمازون چند کلاس های ذخیره سازی برای نیازهای مختلف مشتریان را ارائه می دهد. کلاس ذخیره سازی استاندارد کلاس ذخیره سازی پیش فرض است و بدان معنی است که کار برکنار شده کپی از داده ها در مکان های مختلف ذخیره خواهد شد. کلاس ذخیره سازی REDUCED_REDUNDANCY را ارائه می دهد مشتریان که با استفاده از S3 آمازون برای ذخیره سازی داده های غیر بحرانی، تجدید کم هزینه گزینه ذخیره سازی بسیار در دسترس است، اما کمتر زائد (Automatic Translation)
