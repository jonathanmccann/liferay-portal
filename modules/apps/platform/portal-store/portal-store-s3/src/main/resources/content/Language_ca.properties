minimum-uploads-part-size=Mida mínima part (Automatic Translation)
minimum-uploads-part-size-help=Defineix la mida mínima part per a càrrega peces. Disminució de la mida mínima part provoca diverses càrregues estar dividit en un major nombre de parts més petites. Creació d'aquest valor massa baix té un efecte negatiu sobre la velocitat de transferència, provocant comunicació latència i xarxa addicional per a cada part (Automatic Translation)
multipart-upload-threshold=Llindar de carregar diverses parts (Automatic Translation)
multipart-upload-threshold-help=Estableix el llindar de mida en bytes per quan utilitzar diverses càrregues. Carrega sobre aquesta mida automàticament farà servir una estratègia carregar diverses parts, mentre carrega més petit que aquest llindar utilitzarà una sola connexió per pujar tot l'objecte (Automatic Translation)
s3-region=Regió de S3 (Automatic Translation)
s3-region-help=Amazon S3 Regions permeten als usuaris triar la regió geogràfica on emmagatzemarà els cubs Amazon S3 de l'usuari crea. Escolliu una regió de S3 d'Amazon per optimitzar el temps d'espera, minimitzar costos o abordar els requisits reglamentaris. Objectes emmagatzemats en una regió de S3 d'Amazon mai deixi aquesta regió llevat que explícitament transferit a una altra regió (Automatic Translation)
s3-storage-class=Classe d'emmagatzematge de S3 (Automatic Translation)
s3-storage-class-help=Amazon S3 ofereix múltiples classes d'emmagatzematge per a les necessitats dels clients diferents. La classe estàndard d'emmagatzematge és la classe d'emmagatzematge per defecte i significa que redundants còpies de les dades s'emmagatzemaran en llocs diferents. La classe d'emmagatzematge REDUCED_REDUNDANCY ofereix als clients que estan utilitzant Amazon S3 per emmagatzemar dades no crítica, reproduïbles una opció de baix cost d'emmagatzematge molt disponibles, però menys redundants, (Automatic Translation)
