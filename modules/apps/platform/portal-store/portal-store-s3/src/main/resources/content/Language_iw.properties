s3-storage-class=מחלקת אחסון S3 (Automatic Translation)
s3-storage-class-help=אמזון S3 מציע שיעורי אחסון מרובים עבור צרכי הלקוחות השונים. מחלקת אחסון סטנדרטית היא מחלקת אחסון ברירת המחדל, משמעותה כי יתיר עותקים של נתונים יאוחסנו במקומות שונים. מחלקת אחסון REDUCED_REDUNDANCY מציעה ללקוחותיה המשתמשים אמזון S3 עבור אחסון הנתונים לא קריטיות, לשחזור אופציה זמינות גבוהה, אבל פחות מיותר, אחסון בעלות נמוכה (Automatic Translation)
