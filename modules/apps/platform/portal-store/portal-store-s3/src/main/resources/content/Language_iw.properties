multipart-upload-threshold-help=קביעת הסף גודל בבתים של מתי להשתמש העלאות מרובה חלקים. העלאות על גודל זה ישתמש אוטומטית אסטרטגיה להעלות מרובה חלקים, בעוד העלאות קטן יותר שהמכסה ישתמש חיבור יחיד להעלות את האובייקט כולו (Automatic Translation)
s3-region=אזור S3 (Automatic Translation)
