minimum-uploads-part-size=Tamanho mínimo da parte (Automatic Translation)
minimum-uploads-part-size-help=Define o tamanho mínimo parte para carregar as peças. Diminuir o tamanho mínimo parte faz com que várias partes uploads para ser dividido em um número maior de partes menores. Definir esse valor muito baixo tem um efeito negativo nas velocidades de transferência, causando extra latência e rede de comunicação para cada parte (Automatic Translation)
multipart-upload-threshold=Limite de upload de várias partes (Automatic Translation)
multipart-upload-threshold-help=Define o limite de tamanho em bytes para quando usar carregamentos de várias partes. Carregamentos mais este tamanho usará automaticamente uma estratégia de upload de várias partes, enquanto carregamentos menores do que este limiar usará uma única conexão para carregar todo o objeto (Automatic Translation)
s3-region=Região de S3 (Automatic Translation)
s3-region-help=Amazon S3 regiões permitem ao usuário escolher a região geográfica onde a Amazon S3 armazenará os baldes o usuário cria. Escolha uma região de Amazon S3 para otimizar a latência, minimizar os custos ou atender a requisitos normativos. Objetos armazenados em um Amazon S3 região nunca deixar essa região a menos que explicitamente transferido para outra região (Automatic Translation)
s3-storage-class=Classe de armazenamento S3 (Automatic Translation)
s3-storage-class-help=Amazon S3 oferece várias classes de armazenamento para as necessidades de diferentes clientes. A classe de armazenamento padrão é a classe de armazenamento padrão e significa que cópias redundantes de dados serão armazenadas em locais diferentes. A classe de armazenamento REDUCED_REDUNDANCY oferece aos clientes que estão usando o Amazon S3 para armazenar dados não críticos, pode ser reproduzidos uma opção de armazenamento altamente disponível, mas menos redundantes, de baixo custo (Automatic Translation)
