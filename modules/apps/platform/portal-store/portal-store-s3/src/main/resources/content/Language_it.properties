cache-dir-clean-up-frequency-help=Definisce il rapporto tra il numero di chiamate al metodo pulito file della cache e la cache di file effettivo pulita. Impostare su 1 per pulire sempre. I numeri più alti si abbasseranno la frequenza (Automatic Translation)
