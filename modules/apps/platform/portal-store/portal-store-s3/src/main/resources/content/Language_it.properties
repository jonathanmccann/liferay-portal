minimum-uploads-part-size=Dimensione minima parte (Automatic Translation)
minimum-uploads-part-size-help=Imposta la dimensione minima parte per caricare parti. Diminuendo la dimensione minima parte causa multipart upload sia suddiviso in un numero maggiore di parti più piccole. L'impostazione di questo valore troppo basso ha un effetto negativo sulla velocità di trasferimento, causando supplementare latenza e rete di comunicazione per ogni parte (Automatic Translation)
multipart-upload-threshold=Soglia di caricamento multipart (Automatic Translation)
multipart-upload-threshold-help=Imposta la soglia della dimensione in byte per quando utilizzare multipart upload. Upload su questa dimensione utilizzerà automaticamente una strategia di caricamento più parti, mentre upload inferiore a questa soglia utilizzerà una singola connessione per caricare l'intero oggetto (Automatic Translation)
s3-region=Regione di S3 (Automatic Translation)
s3-region-help=Amazon S3 regioni consentono all'utente di scegliere l'area geografica dove Amazon S3 memorizzerà i secchi l'utente crea. Scegli una regione di Amazon S3 per ottimizzare la latenza, minimizzare i costi o soddisfare requisiti normativi. Gli oggetti memorizzati in una regione di Amazon S3 mai lasciano quella regione a meno che non esplicitamente trasferito in un'altra regione (Automatic Translation)
s3-storage-class=Classe di archiviazione S3 (Automatic Translation)
s3-storage-class-help=Amazon S3 offre molteplici classi di archiviazione per diverse esigenze dei clienti. La classe di archiviazione STANDARD è la classe di archiviazione predefinita e significa che verranno archiviate copie ridondanti dei dati in posizioni diverse. La classe di archiviazione REDUCED_REDUNDANCY offre ai clienti che utilizzano Amazon S3 per archiviare dati non critici, riproducibili un'opzione di archiviazione altamente disponibile, ma meno ridondanti, di basso costo (Automatic Translation)
