minimum-uploads-part-size=Taille minimale de partie (Automatic Translation)
minimum-uploads-part-size-help=Définit la taille de la partie minimale pour les pièces de téléchargement. Réduction de la taille minimale partie provoque multiparts téléchargements à se diviser en un plus grand nombre de pièces plus petites. Choisir une valeur trop faible a un effet négatif sur les vitesses de transfert, causant une communication réseau et latence supplémentaires pour chaque partie (Automatic Translation)
multipart-upload-threshold=Seuil de Téléchargement multipartie (Automatic Translation)
multipart-upload-threshold-help=Définit le seuil de la taille en octets pour quand utiliser uploads multiparts. Ajouts sur cette taille utilisera automatiquement une stratégie de Téléchargement multipartie, tandis que de téléchargements plus petites que ce seuil utilisera une seule connexion pour télécharger la totalité de l'objet (Automatic Translation)
s3-region=Région de S3 (Automatic Translation)
s3-region-help=Amazon S3 régions permettent à l'utilisateur de choisir la région géographique où Amazon S3 stockera les seaux l'utilisateur crée. Choisissez une région de S3 Amazon afin d'optimiser la latence, minimiser les coûts ou répondre aux exigences réglementaires. Les objets stockés dans une région de S3 Amazon jamais quittent cette région à moins qu'explicitement son transfert vers une autre région (Automatic Translation)
s3-storage-class=Classe de stockage S3 (Automatic Translation)
s3-storage-class-help=Amazon S3 propose plusieurs classes de stockage pour les besoins des différents clients. La classe de stockage STANDARD est la classe de stockage par défaut et signifie que les copies redondantes de données seront stockées dans des lieux différents. La classe de stockage REDUCED_REDUNDANCY offre aux clients qui utilisent Amazon S3 pour stocker des données non critiques, reproductibles une option de stockage hautement disponible, mais moins redondant, faible coût (Automatic Translation)
