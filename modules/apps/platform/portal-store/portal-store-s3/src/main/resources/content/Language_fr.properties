cache-dir-clean-up-frequency-help=Définit le rapport entre le nombre d'appels à la méthode de nettoyage de fichiers cache et du cache de fichier réel propre. Nettoyez toujours la valeur 1. Un nombre plus élevé réduira la fréquence (Automatic Translation)
