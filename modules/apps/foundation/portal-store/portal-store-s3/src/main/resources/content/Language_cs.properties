s3-storage-class=Třída S3 úložiště (Automatic Translation)
s3-storage-class-help=Amazon S3 nabízí více úložiště tříd pro potřeby různých zákazníků. STANDARDNÍ ukládání třída je třída výchozí úložiště a znamená, že redundantní kopie dat budou uloženy na různých místech. Třídy úložiště REDUCED_REDUNDANCY nízkonákladových vysoce dostupné, ale méně redundantní úložiště možnost nabízí zákazníkům, kteří používají Amazon S3 pro ukládání dat, není kritická, reprodukovatelné (Automatic Translation)
