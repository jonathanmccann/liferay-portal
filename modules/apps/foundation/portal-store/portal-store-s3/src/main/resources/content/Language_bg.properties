minimum-uploads-part-size=Размер на минимална част (Automatic Translation)
minimum-uploads-part-size-help=Задава минималния част размер за качване на части. Намаляването на размера на минималната част причинява многокомпонентни качени да се раздели на по-голям брой по-малки части. Задаване на тази стойност твърде ниска има отрицателен ефект върху прехвърляне скорости, причинява допълнителни латентност и мрежова комуникация за всяка част (Automatic Translation)
multipart-upload-threshold=Ограничение за подчастите качване праг (Automatic Translation)
multipart-upload-threshold-help=Задава праг на размера в байтове за кога да използвате многокомпонентни качени. Качени над този размер автоматично ще използва стратегия многокомпонентни качване, докато качването на по-малки от този праг ще използва една връзка да се качите на целия обект (Automatic Translation)
s3-region=S3 регион (Automatic Translation)
s3-region-help=Amazon S3 региони позволяват на потребителя да избере географски регион, където ще се съхранява Amazon S3 кофи потребител създава. Изберете Amazon S3 регион за оптимизиране на latency, минимизиране на разходите или регулаторни изисквания. Предмети, съхранявани в Amazon S3 регион никога не напусне този регион, освен ако изрично прехвърлени в друг регион (Automatic Translation)
s3-storage-class=S3 на класа външна памет (Automatic Translation)
s3-storage-class-help=Amazon S3 предлага множество съхранение класове за нуждите на различни клиенти. ЗНАМЕ съхранение класа е по подразбиране за съхранение класа и означава, че излишно копия на данни ще се съхраняват на различни места. REDUCED_REDUNDANCY на класа външна памет предлага клиенти, които използват Amazon S3 за съхраняване на некритични, възпроизводими данни нискотарифни високо разположение, но по-малко излишни, съхранение опция (Automatic Translation)
