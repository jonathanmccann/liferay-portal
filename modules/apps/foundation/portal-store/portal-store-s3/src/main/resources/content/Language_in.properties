minimum-uploads-part-size=Ukuran minimum bagian (Automatic Translation)
minimum-uploads-part-size-help=Menetapkan ukuran minimum bagian untuk meng-upload bagian. Memperkecil ukuran minimum bagian menyebabkan multipart upload untuk dibagi ke dalam sejumlah besar bagian yang lebih kecil. Menetapkan nilai ini terlalu rendah memiliki efek negatif pada kecepatan transfer, menyebabkan tambahan latency dan jaringan komunikasi untuk setiap bagian (Automatic Translation)
multipart-upload-threshold=Meng-upload Multipart ambang (Automatic Translation)
multipart-upload-threshold-help=Menetapkan batas ukuran dalam byte untuk ketika menggunakan multipart upload. Upload lebih dari ukuran ini akan secara otomatis menggunakan strategi multipart upload, sementara upload lebih kecil daripada batas ini akan menggunakan satu koneksi untuk meng-upload seluruh objek (Automatic Translation)
s3-region=Wilayah S3 (Automatic Translation)
s3-region-help=Amazon S3 daerah memungkinkan pengguna untuk memilih wilayah geografis yang mana Amazon S3 akan menyimpan ember pengguna menciptakan. Pilih wilayah S3 Amazon untuk mengoptimalkan latensi, meminimalkan biaya atau alamat persyaratan peraturan. Benda-benda yang disimpan di Amazon S3 daerah tidak pernah meninggalkan wilayah itu kecuali secara eksplisit ditransfer ke daerah lain (Automatic Translation)
s3-storage-class=S3 penyimpanan kelas (Automatic Translation)
s3-storage-class-help=Amazon S3 menawarkan beberapa kelas penyimpanan untuk kebutuhan pelanggan yang berbeda. Kelas standar penyimpanan default penyimpanan kelas, dan berarti bahwa berlebihan salinan data akan disimpan dalam lokasi yang berbeda. REDUCED_REDUNDANCY penyimpanan kelas menawarkan pelanggan yang menggunakan Amazon S3 untuk menyimpan data non-kritis, direproduksi rendah sangat tersedia, tetapi kurang berlebihan, Penyimpanan pilihan (Automatic Translation)
