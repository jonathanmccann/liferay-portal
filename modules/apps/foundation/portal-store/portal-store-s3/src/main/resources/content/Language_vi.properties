minimum-uploads-part-size=Kích thước tối thiểu một phần (Automatic Translation)
minimum-uploads-part-size-help=Thiết lập kích thước tối thiểu một phần cho các bộ phận tải lên. Giảm kích thước tối thiểu một phần gây ra phần đa thành tải lên được chia thành nhiều phần nhỏ hơn lớn hơn. Thiết lập giá trị này quá thấp đã tác động tiêu cực đến tốc độ truyền, gây thêm độ trễ và mạng thông tin liên lạc cho từng phần (Automatic Translation)
multipart-upload-threshold=Phần đa thành tải lên ngưỡng (Automatic Translation)
multipart-upload-threshold-help=Thiết lập kích thước ngưỡng theo byte cho khi nào thì sử dụng phần đa thành tải lên. Tải lên hơn kích thước này sẽ tự động sử dụng một chiến lược phần đa thành tải lên, trong khi tải lên nhỏ hơn so với ngưỡng này sẽ sử dụng một kết nối duy nhất để tải lên toàn bộ đối tượng (Automatic Translation)
s3-region=Khu vực S3 (Automatic Translation)
s3-region-help=Các vùng Amazon S3 cho phép người dùng chọn vùng địa lý nơi Amazon S3 sẽ lưu trữ các Xô người dùng tạo ra. Chọn một khu vực Amazon S3 để tối ưu hóa độ trễ, giảm thiểu chi phí hoặc địa chỉ yêu cầu quản lý. Các đối tượng được lưu trữ trong một khu vực Amazon S3 không bao giờ rời khỏi khu vực đó trừ khi rõ ràng chuyển đến một vùng khác (Automatic Translation)
s3-storage-class=S3 lí lớp (Automatic Translation)
s3-storage-class-help=Amazon S3 cung cấp các lớp học lí nhiều cho nhu cầu của khách hàng khác nhau. Lớp học lưu trữ tiêu chuẩn là lớp học lưu trữ mặc định, và có nghĩa là các bản sao dự phòng dữ liệu sẽ được lưu trữ tại các địa điểm khác nhau. REDUCED_REDUNDANCY lí lớp cung cấp cho khách hàng những người đang sử dụng Amazon S3 cho lưu trữ dữ liệu không quan trọng, thể sanh sản nhiều một tùy chọn lưu trữ cao có sẵn, nhưng ít dôi dư, chi phí thấp (Automatic Translation)
