minimum-uploads-part-size-help=अपलोड भागों के लिए कम से कम भाग आकार सेट करता है। कम से कम भाग आकार को कम बहुखण्डीय अपलोड्स छोटे भागों की एक बड़ी संख्या में विभाजित किया जा करने के लिए कारण होता है। यह मान बहुत कम सेट स्थानांतरण गति, प्रत्येक भाग के लिए अतिरिक्त विलंबता और नेटवर्क संचार के कारण पर एक नकारात्मक प्रभाव पड़ता है (Automatic Translation)
multipart-upload-threshold=बहुखण्डीय अपलोड थ्रेशोल्ड (Automatic Translation)
multipart-upload-threshold-help=बहुखण्डीय अपलोड का उपयोग कब करें के लिए बाइट्स में आकार थ्रेशोल्ड सेट करता है। इस आकार से अधिक अपलोड एक बहुखण्डीय अपलोड रणनीति, छोटे से इस दहलीज तो पूरे उद्देश्य अपलोड करने के लिए एक एकल कनेक्शन का उपयोग होगा अपलोड करते समय स्वचालित रूप से उपयोग करेगा (Automatic Translation)
s3-region=S3 क्षेत्र (Automatic Translation)
s3-region-help=अमेज़न S3 क्षेत्रों उपयोगकर्ता भौगोलिक क्षेत्र जहाँ अमेज़न S3 बाल्टी संग्रह करेगा का चयन करने के लिए उपयोगकर्ता की अनुमति बनाता है। एक अमेज़न S3 विलंबता ऑप्टिमाइज़ करें, कम से कम लागत, या विनियामक आवश्यकताओं का पता करने के लिए क्षेत्र का चयन करें। कभी नहीं एक अमेज़न S3 क्षेत्र में संग्रहीत ऑब्जेक्ट्स उस क्षेत्र छोड़ दें जब तक कि स्पष्ट रूप से करने के लिए एक और क्षेत्र स्थानांतरित (Automatic Translation)
s3-storage-class=S3 संग्रहण वर्ग (Automatic Translation)
s3-storage-class-help=अमेज़न S3 एकाधिक संग्रह क्लासेस अलग ग्राहकों की जरूरतों के लिए प्रदान करता है। मानक भंडारण वर्ग डिफ़ॉल्ट संग्रहण वर्ग है, और इसका मतलब है कि डेटा की प्रतिलिपि को अनावश्यक विभिन्न स्थानों में संग्रहीत किया जाएगा। REDUCED_REDUNDANCY संग्रहण वर्ग ग्राहकों को जो गैर-महत्वपूर्ण, प्रतिलिपि प्रस्तुत करने योग्य डेटा संग्रहीत करने के लिए अमेज़न S3 का उपयोग कर रहे हैं एक कम लागत उच्च उपलब्ध है, लेकिन कम निरर्थक, भंडारण विकल्प प्रदान करता है (Automatic Translation)
