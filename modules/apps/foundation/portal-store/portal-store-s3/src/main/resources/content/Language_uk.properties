minimum-uploads-part-size=Частина мінімального розміру (Automatic Translation)
minimum-uploads-part-size-help=Встановлює мінімальну частина розмір для завантаження частин. Зменшення розміру мінімального частина викликає складається з кількох частин закачувань розбити на більшу кількість дрібніші частини. Встановлення занадто малої це значення має негативний вплив на швидкості передачі, викликаючи додатковий час затримки і мережі зв'язку для кожної частини (Automatic Translation)
multipart-upload-threshold=Завантаження з декількох частин поріг (Automatic Translation)
multipart-upload-threshold-help=Встановлює поріг розмір (у байтах) для використання декількох частин закачувань. Додавання над такого розміру буде автоматично використовувати складається з кількох частин завантажити стратегія, під час передавання менше, ніж цей поріг буде використовувати одного підключення, щоб завантажити весь об'єкт (Automatic Translation)
s3-region=S3 регіону (Automatic Translation)
s3-region-help=Amazon S3 регіонів користувачі могли обрати географічний регіон, де буде зберігати Amazon S3 відра користувач створює. Виберіть Amazon S3 регіон оптимізувати затримки, мінімізувати витрати або вирішення регуляторних вимог. Об'єктів, що зберігаються в Amazon S3 регіону ніколи не залишити цього регіону, якщо явно переведені в інший регіон (Automatic Translation)
s3-storage-class=S3 зберігання клас (Automatic Translation)
s3-storage-class-help=Amazon S3 пропонує кілька сховища класів для різних потреб клієнта. Стандартний зберігання клас є зберігання клас за замовчуванням і означає, що надлишкові копії даних буде зберігатися в різних розташуваннях. Клас REDUCED_REDUNDANCY зберігання пропонує клієнтами, які використовують Amazon S3 для зберігання даних не критичних, відтворюваним недорогих дуже доступні, але менш надлишковим, зберігання варіант (Automatic Translation)
