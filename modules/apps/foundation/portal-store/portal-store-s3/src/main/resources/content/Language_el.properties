http-client-max-connections-help=Ορίζει τον μέγιστο αριθμό των επιτρεπόμενων συνδέσεις HTTP (Automatic Translation)
http-client-max-error-retry=Μέγιστη http επαναλήψεων (Automatic Translation)
http-client-max-error-retry-help=Ορίζει τον μέγιστο αριθμό επαναλήψεων επιχειρεί αποτυχημένων αιτήσεων είναι δυνατόν να επαναληφθεί (Automatic Translation)
max-pool-size=Μέγιστο μέγεθος χώρου συγκέντρωσης (Automatic Translation)
max-pool-size-help=Μέγιστος αριθμός νημάτων που χρησιμοποιήθηκαν για να φορτώσετε τα μέρη (Automatic Translation)
minimum-uploads-part-size=Ελάχιστο μέρος μεγέθους (Automatic Translation)
minimum-uploads-part-size-help=Ορίζει το μέγεθος ελάχιστο μέρος για upload μέρη. Μείωση του μεγέθους της ελάχιστης επιτρεπόμενης προκαλεί πολλά τμήματα προσθήκες να διασπαστεί σε ένα μεγαλύτερο αριθμό μικρότερων τμημάτων. Ρύθμιση αυτής της τιμής πολύ χαμηλή έχει αρνητική επίδραση στην ταχύτητες μεταφοράς, προκαλώντας επιπλέον καθυστέρηση και δικτύου επικοινωνίας για κάθε τμήμα (Automatic Translation)
multipart-upload-threshold=Πολλά τμήματα upload όριο (Automatic Translation)
multipart-upload-threshold-help=Ορίζει το όριο μέγεθος σε byte για το πότε πρέπει να χρησιμοποιείτε πολλά τμήματα προσθήκες. Προσθήκες κατά τη διάρκεια αυτού του μεγέθους θα χρησιμοποιήσει αυτόματα μια στρατηγική αποστολή πολλών τμημάτων, ενώ προσθήκες που είναι μικρότερο από το όριο αυτό θα χρησιμοποιήσει μια μεμονωμένη σύνδεση να μεταφορτώσετε ολόκληρο το αντικείμενο (Automatic Translation)
s3-region=Περιοχή S3 (Automatic Translation)
s3-region-help=Amazon S3 περιοχές επιτρέπουν στο χρήστη να επιλέξει τη γεωγραφική περιοχή όπου η Amazon S3 θα αποθηκεύσετε τις λίστες παλαιών αρχείων στο χρήστη δημιουργεί. Επιλέξτε μια περιοχή του Αμαζονίου S3 για να βελτιστοποιήσετε την αδράνεια, ελαχιστοποίηση του κόστους ή αντιμετώπιση ρυθμιστικών απαιτήσεων. Αντικείμενα που είναι αποθηκευμένα σε μια περιοχή του Αμαζονίου S3 ποτέ δεν αφήσει αυτήν την περιοχή εκτός και αν ρητά έχει μεταφερθεί σε άλλη περιοχή (Automatic Translation)
s3-storage-class=Κατηγορία S3 αποθήκευσης (Automatic Translation)
s3-storage-class-help=Amazon S3 προσφέρει πολλές κλάσεις αποθήκευσης για τις ανάγκες των διαφορετικών πελατών. Η κλάση πρότυπο αποθήκευσης είναι η προεπιλεγμένη κλάση αποθήκευσης, και σημαίνει ότι εφεδρικά αντίγραφα των δεδομένων θα αποθηκεύονται σε διαφορετικές τοποθεσίες. Η κλάση REDUCED_REDUNDANCY αποθήκευσης προσφέρει στους πελάτες που χρησιμοποιούν Amazon S3 αποθήκευσης δεδομένων δεν είναι κρίσιμο και αναπαραγώγιμη μια επιλογή αποθήκευσης υψηλής διαθεσιμότητας, αλλά λιγότερο περιττό, χαμηλού κόστους (Automatic Translation)
