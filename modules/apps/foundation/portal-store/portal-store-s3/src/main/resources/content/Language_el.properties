cache-dir-clean-up-frequency=Κατάλογο cache εκκαθάριση συχνότητα (Automatic Translation)
cache-dir-clean-up-frequency-help=Καθορίζει την αναλογία ανάμεσα στον αριθμό των κλήσεων προς καθαρή μέθοδος cache αρχείων και το πραγματικό αρχείο cache καθαρό. Οριστεί σε 1 για να καθαρίσετε πάντα. Μεγαλύτεροι αριθμοί θα μειώσει τη συχνότητα (Automatic Translation)
