s3-storage-class=Triedou S3 storage (Automatic Translation)
s3-storage-class-help=Amazon S3 ponúka viacero tried batožiny pre rôznych zákazníkov. ŠTANDARD skladovacie trieda je trieda predvolené skladovanie, a znamená, že nadbytočné kópie údajov budú uložené na rôznych miestach. REDUCED_REDUNDANCY skladovanie triedy ponúka zákazníkov, ktorí používajú Amazon S3 pre ukladanie dát Nekritická, reprodukovateľné cenovo veľmi dostupné, ale menej zbytočné, skladovacie možnosti (Automatic Translation)
