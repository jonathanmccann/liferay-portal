minimum-uploads-part-size-help=Nastaví veľkosť minimálne časť odovzdanie časti. Zmenšenie veľkosti minimálne časť spôsobuje viacdielne obrázky rozdelí na väčšie množstvo menších častí. Nastavenie tejto hodnoty príliš nízke má negatívny vplyv na prenosové rýchlosti, a to spôsobuje ďalšie latencia a sieťové komunikácie pre každú časť (Automatic Translation)
multipart-upload-threshold=Viacdielne upload limit (Automatic Translation)
