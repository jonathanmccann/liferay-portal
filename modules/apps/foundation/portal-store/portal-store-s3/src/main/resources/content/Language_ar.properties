minimum-uploads-part-size=حجم جزء الحد الأدنى (Automatic Translation)
minimum-uploads-part-size-help=يقوم بتعيين حجم إطار الحد الأدنى لتحميل أجزاء. تقليل حجم جزء الحد الأدنى يؤدي التحميلات متعددة الأجزاء تقسيمها إلى عدد أكبر من أجزاء أصغر. تعيين هذه القيمة منخفضة جداً له تأثير سلبي على نقل بسرعة، مما تسبب في إضافي الكمون وشبكة الاتصالات لكل جزء (Automatic Translation)
multipart-upload-threshold=عتبة تحميل متعددة الأجزاء (Automatic Translation)
multipart-upload-threshold-help=تعيين عتبة الحجم بالبايت لعند استخدام التحميلات متعددة الأجزاء. تحميل على هذا الحجم سيتم تلقائياً استخدام استراتيجية تحميل متعددة الأجزاء، أثناء تحميل أصغر من هذه العتبة سيتم استخدام اتصال واحد لتحميل الكائن بأكمله (Automatic Translation)
s3-region=المنطقة S3 (Automatic Translation)
s3-region-help=مناطق الأمازون S3 تسمح للمستخدم باختيار المنطقة الجغرافية حيث سيتم تخزين الأمازون S3 الدلاء المستخدم يقوم بإنشاء. اختر منطقة الأمازون S3 لتحسين زمن الوصول أو التقليل إلى أدنى حد من تكاليف معالجة المتطلبات التنظيمية. الكائنات المخزنة في منطقة الأمازون S3 ابدأ مغادرة تلك المنطقة ما لم نقل صراحة إلى منطقة أخرى (Automatic Translation)
s3-storage-class=فئة تخزين S3 (Automatic Translation)
s3-storage-class-help=S3 الأمازون يقدم فئات التخزين متعددة لاحتياجات العملاء المختلفة. فئة التخزين القياسية هي فئة التخزين الافتراضية، ويعني أنه سيتم تخزين نسخ مكررة من البيانات في مواقع مختلفة. يوفر فئة تخزين REDUCED_REDUNDANCY العملاء الذين يستخدمون S3 الأمازون لتخزين البيانات غير الهامة، واستنساخه خيار تخزين المتوفرة بشكل كبير، ولكن أقل زائدة عن الحاجة، منخفضة التكلفة (Automatic Translation)
