cache-dir-clean-up-frequency=Каталог кэша очистки частота (Automatic Translation)
cache-dir-clean-up-frequency-help=Определяет отношение между количество звонков в чистый метод файла кэша и фактический файл кэша чистой. Установите 1 для очистки всегда. Увеличение числа снизит частоту (Automatic Translation)
