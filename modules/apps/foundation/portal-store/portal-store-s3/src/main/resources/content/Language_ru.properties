max-pool-size-help=Максимальное количество потоков, используемых для загрузки деталей (Automatic Translation)
minimum-uploads-part-size=Минимальная часть размер (Automatic Translation)
minimum-uploads-part-size-help=Устанавливает минимальную часть размер для загрузки деталей. Уменьшение размера минимального часть вызывает многотомные закачек разделить на большее количество меньших частей. Слишком низкое значение имеет негативное влияние на скорость передачи, вызывая дополнительные задержки и сети связи для каждой части (Automatic Translation)
multipart-upload-threshold=Порог многотомные загрузки (Automatic Translation)
multipart-upload-threshold-help=Задает порог размера в байтах для использования составных закачек. Загрузка файлов через этот размер будет автоматически использовать стратегию многотомные загрузки, во время загрузки меньше, чем этот порог будет использовать одно подключение для загрузки весь объект (Automatic Translation)
s3-region=S3 регион (Automatic Translation)
s3-region-help=Amazon S3 регионах позволяют пользователю выбрать географический регион, где Amazon S3 будет хранить ведра пользователь создает. Выберите регион Амазонки S3 оптимизировать задержку, минимизировать затраты, или удовлетворения нормативных требований. Объекты, хранящиеся в Амазонии S3 никогда не покинуть этот регион, если явно переведен в другой регион (Automatic Translation)
s3-storage-class=Класс хранения S3 (Automatic Translation)
s3-storage-class-help=Amazon S3 предлагает несколько классов хранения для различных клиентов. Класс хранения стандартный класс хранения по умолчанию и означает, что резервные копии данных будут храниться в разных местах. Класс хранения REDUCED_REDUNDANCY предлагает клиентам, которые используют Amazon S3 для хранения данных некритических, воспроизводимые варианта хранения высокой доступности, но менее избыточным, лоу кост (Automatic Translation)
s3.store.configuration.name=S3 Конфигурация хранилища (Automatic Translation)
