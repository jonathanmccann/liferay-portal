s3-storage-class=S3 lagringsklasse (Automatic Translation)
s3-storage-class-help=Amazon S3 tilbyr flere bagasje klasser for forskjellige kunders behov. MÅLESTOKK lagringsklassen er standard lagringsklassen, og betyr at overflødige kopier av data vil bli lagret på forskjellige steder. REDUCED_REDUNDANCY lagringsklassen tilbyr kunder som bruker Amazon S3 for lagring av ikke-kritiske, reproduserbare data en rimelig svært tilgjengelig, men mindre redundant lagringsalternativ (Automatic Translation)
